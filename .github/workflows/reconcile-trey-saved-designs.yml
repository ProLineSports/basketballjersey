name: Reconcile Trey saved designs

on:
  push:
    branches:
      - fix/reconcile-axiom-saved-designs-camera
    paths:
      - .github/workflows/reconcile-trey-saved-designs.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Axiom repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/reconcile-axiom-saved-designs-camera

      - name: Configure Git
        run: |
          git config user.name "ProLine Builder Repair"
          git config user.email "design@prolinemockups.com"

      - name: Apply and reconcile saved-camera restoration
        shell: bash
        run: |
          set -euo pipefail
          if ! git cherry-pick 1f73863fcc056dd112bb67f6d7d1d7f301abfb59; then
            python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/helmet/page.jsx')
          text = path.read_text(encoding='utf-8')

          conflict_pattern = re.compile(
              r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> [^\n]+\n?',
              re.DOTALL,
          )
          resolved_kinds = []

          def resolve_conflict(match):
              ours = match.group(1)
              incoming = match.group(2)

              if 'const recenterView = useCallback' in ours and 'const applySavedCameraSettings = useCallback' in incoming:
                  resolved_kinds.append('view-controls-plus-camera-helper')
                  return ours.rstrip() + '\n\n' + incoming.lstrip()

              if 'const camera = cameraRef.current' in ours and 'pendingCameraRestoreRef.current = cameraSettings' in incoming:
                  resolved_kinds.append('deferred-camera-restore')
                  return incoming.lstrip()

              raise SystemExit(
                  'Unexpected page.jsx conflict. Refusing to guess.\n'
                  + 'OURS:\n' + ours[:1200] + '\nINCOMING:\n' + incoming[:1200]
              )

          text, conflict_count = conflict_pattern.subn(resolve_conflict, text)
          if conflict_count != 2:
              raise SystemExit(f'Expected exactly 2 semantic conflict blocks; found {conflict_count}.')

          old_listener = "const onCameraInteraction = () => setActiveViewPreset(null);"
          new_listener = "const onCameraInteraction = () => setActiveViewPreset('custom');"
          if old_listener not in text:
              raise SystemExit('Expected Axiom camera interaction listener was not found.')
          text = text.replace(old_listener, new_listener, 1)

          anonymous_listener = """
              // Once the user manually rotates, pans, or zooms, preserve that exact composition.
              controls.addEventListener('start', () => setActiveViewPreset('custom'));
          """
          text = text.replace(anonymous_listener, '\n', 1)

          if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
              raise SystemExit('Conflict markers remain after reconciliation.')

          required_markers = (
              'const recenterView = useCallback',
              'const applySavedCameraSettings = useCallback',
              'pendingCameraRestoreRef.current = cameraSettings',
              'setCameraRestoreRevision(value => value + 1)',
              "const onCameraInteraction = () => setActiveViewPreset('custom');",
          )
          missing = [marker for marker in required_markers if marker not in text]
          if missing:
              raise SystemExit('Missing reconciled camera markers: ' + ', '.join(missing))

          path.write_text(text, encoding='utf-8')
          print('Resolved:', ', '.join(resolved_kinds))
          PY

            git add app/helmet/page.jsx
            GIT_EDITOR=true git cherry-pick --continue
          fi

      - name: Verify saved-design versions and Axiom support
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('app/helmet/page.jsx').read_text(encoding='utf-8')
          error = 'This saved design is not compatible with the current Helmet Builder.'
          error_index = text.find(error)
          if error_index < 0:
              raise SystemExit('Compatibility error message not found; loader structure changed unexpectedly.')

          compatibility_window = text[max(0, error_index - 2500):error_index + 600]
          version_gate_patterns = (
              r'\[\s*1\s*,\s*2\s*,\s*3\s*\]\.includes\([^)]*version[^)]*\)',
              r'version\s*!==?\s*1[\s\S]{0,250}version\s*!==?\s*2[\s\S]{0,250}version\s*!==?\s*3',
              r'version\s*===?\s*1[\s\S]{0,250}version\s*===?\s*2[\s\S]{0,250}version\s*===?\s*3',
          )
          if not any(re.search(pattern, compatibility_window) for pattern in version_gate_patterns):
              print('Compatibility context:\n', compatibility_window)
              raise SystemExit('The load gate does not visibly accept saved-design versions 1, 2, and 3.')

          required = (
              "version: 3",
              "'axiom-a'",
              "'axiom-b'",
              'HELMET_CONFIGS',
              'applySavedCameraSettings',
              'pendingCameraRestoreRef',
          )
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('Missing required Axiom/camera markers: ' + ', '.join(missing))

          print('Confirmed: v1/v2/v3 load gate, Axiom A/B, and deferred camera restoration.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests when present
        run: npm test --if-present

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Remove one-time repair workflow and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-trey-saved-designs.yml
          git add -A
          git commit -m "Remove one-time Trey reconciliation workflow"
          git push origin HEAD:fix/reconcile-axiom-saved-designs-camera
